<!doctype html><meta charset="utf-8"><title>Buzz Night — all 100 logos</title>
<style>
 body{background:#1a1030;color:#f3eefb;font:15px/1.5 'Segoe UI',system-ui,sans-serif;margin:0;padding:24px}
 h1{font-size:1.5rem;margin:0 0 4px}
 p.sub{color:#b7a9ce;margin:0 0 20px;max-width:60ch}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
 .card{background:#241a3d;border:1px solid #3a2c58;border-radius:12px;padding:10px;text-align:center}
 .card.flag{outline:3px solid #ff8a7a}
 .pic{width:100%;aspect-ratio:1;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
 .pic img{width:100%;height:100%;object-fit:contain}
 .nm{font-size:.85rem;margin-top:8px;font-weight:700}
 .px{font-size:.72rem;color:#7d6f96;font-variant-numeric:tabular-nums}
 .bar{position:sticky;top:0;background:#1a1030;padding:10px 0;margin-bottom:10px;border-bottom:1px solid #3a2c58}
 button{background:#ffce3a;color:#241a04;border:0;border-radius:8px;padding:8px 14px;font-weight:800;cursor:pointer}
 #out{margin-top:12px;color:#5fe3a1;font-family:Consolas,monospace;font-size:.85rem;word-break:break-all}
</style>
<h1>All 100 logos, as the game will show them</h1>
<p class="sub">Click any that show the company <b>name</b> rather than just a symbol — they give the answer away. Then press Copy and paste the list back to me.</p>
<div class="bar"><button onclick="copyList()">Copy the flagged ones</button><span id="count" style="margin-left:10px;color:#b7a9ce"></span><div id="out"></div></div>
<div class="grid" id="g"></div>

const flagged=new Set();
const g=document.getElementById('g');
function best(d){return ['https://www.google.com/s2/favicons?domain='+d+'&sz=256','https://icons.duckduckgo.com/ip3/'+d+'.ico','https://unavatar.io/'+d];}
LOGOS.forEach(l=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<div class="pic"><img alt=""></div><div class="nm"></div><div class="px"></div>';
  c.querySelector('.nm').textContent=l.n;
  const img=c.querySelector('img');const px=c.querySelector('.px');
  const urls=best(l.d);let i=0,bw=0,bu='';
  (function next(){
    if(i>=urls.length){img.src=bu;px.textContent=bw+'px';return;}
    const u=urls[i++];const t=new Image();
    t.onload=()=>{if(t.naturalWidth>bw){bw=t.naturalWidth;bu=u;}next();};
    t.onerror=next;t.src=u;
  })();
  c.onclick=()=>{if(flagged.has(l.n)){flagged.delete(l.n);c.classList.remove('flag');}else{flagged.add(l.n);c.classList.add('flag');}
    document.getElementById('count').textContent=flagged.size+' flagged';};
  g.appendChild(c);
});
function copyList(){const s=[...flagged].join(', ');document.getElementById('out').textContent=s||'(none flagged)';
  navigator.clipboard&&navigator.clipboard.writeText(s);}
